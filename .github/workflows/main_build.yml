name: Flutter Release APK Auto Build

on:
  push:
    branches: [ "main", "master", "dev", "feature/road" ]
  pull_request:
    branches: [ "main", "master", "dev", "feature/road" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 환경 세팅 (Android 빌드 필수)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Flutter SDK 설치 (최신 Stable 버전 자동 감지)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. GitHub Secrets에 저장된 .env 내용을 가져와 .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      # 5. Base64로 저장된 Release Keystore 파일 복원
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 6. 종속성 패키지 설치
      - name: Install dependencies
        run: flutter pub get

      # 7. Release Keystore 서명이 적용된 Release APK 빌드
      - name: Build Release APK
        env:
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release -t lib/main_home.dart

      # 8. 빌드 완료된 APK를 GitHub Actions 작업 결과물(Artifact)로 업로드
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk